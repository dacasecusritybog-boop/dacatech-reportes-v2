name: Build DACATECH Reportes V2 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "V5-corregido/dacatech-reportes/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: V5-corregido/dacatech-reportes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: V5-corregido/dacatech-reportes/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install web dependencies
        run: npm ci

      - name: Install Capacitor Android tools
        run: npm install @capacitor/core@^6 @capacitor/cli@^6 @capacitor/android@^6

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: V5-corregido/dacatech-reportes/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DACATECH-Reportes-V2-APK
          path: V5-corregido/dacatech-reportes/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
